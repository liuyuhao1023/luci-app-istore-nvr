name: Build and Release iStore NVR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Multi-Arch Binaries, IPK & APK Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend Assets
        run: |
          cd frontend
          npm install
          npm run build-only

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build Multi-Arch Binaries
        run: |
          mkdir -p bin
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../bin/istore-nvr-linux-amd64 ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../bin/istore-nvr-linux-arm64 ./cmd/server
          cd ..

      - name: Build Dual Format Packages (IPK & APK)
        run: |
          chmod +x scripts/build_packages.sh
          ./scripts/build_packages.sh

      - name: Package Release Archives
        run: |
          mkdir -p dist-release
          # 打包二进制
          cd bin
          tar -czvf ../dist-release/istore-nvr-linux-amd64.tar.gz istore-nvr-linux-amd64
          tar -czvf ../dist-release/istore-nvr-linux-arm64.tar.gz istore-nvr-linux-arm64
          # 复制双格式安装包
          cp *.ipk ../dist-release/ || true
          cp *.apk ../dist-release/ || true
          cd ..
          ls -lh dist-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-release/*
          draft: false
          prerelease: false
          generate_release_notes: true
